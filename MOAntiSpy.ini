; ============================================================================
; MOAntiSpy - 己方建筑优先攻击射程内的敌方间谍
;
; 【使用范围】建议仅 PVE / 单人战役 / 人机对战使用。
;             联机安全性未验证，请勿在 PVP 中使用。
;
; 开关：游戏内「游戏规则」界面的「自动反间谍(单机)」复选框。
;       插件优先读 Client\SkirmishSettings.ini 的 chkAntiSpy，其次 spawn.ini。
; ============================================================================
[AntiSpy]
; 0 = 关闭（默认）；勾选界面选项后由勾选值覆盖
Enable=0

; 扫描间隔(逻辑帧)。15 ≈ 半秒
Interval=15

; 间谍类型 ID，逗号分隔，不区分大小写
SpyTypes=SPY,SBTR,ARSO,INTRUDER,HIJACKER,REPU,CLAIR

; 1 = 纯对空武器(如爱国者)不参与
SkipAA=1

; 1 = 写 MOAntiSpy.log（排查时打开）
Log=0
