; ============================================================================
; MOAntiSpy - 己方单位/建筑优先攻击攻击范围内的敌方间谍
;
; 【使用范围】建议仅 PVE / 单人战役 / 人机对战使用。
;             禁止在 PVP（玩家对玩家）中使用。
;
; 开关：游戏内「游戏规则」界面的「自动反间谍(单机)」复选框（写入 spawn.ini）。
;       没有该界面时，可把下面 Enable 改成 1 强制开启。
; ============================================================================
[AntiSpy]
; 0 = 关闭（默认）；spawn.ini 的 AntiSpy 勾选值优先于这里
Enable=0

; 扫描间隔(逻辑帧)。15 ≈ 半秒
Interval=15

; 额外的间谍类型 ID, 逗号分隔。留空使用内置列表(SPY/SPY2/SPY3/SPYF/SPYG/SPYS/SABOT)
SpyTypes=

; 1 = 纯对空武器(如爱国者)不参与, 避免它们被派去打地面间谍
SkipAA=1

; 1 = 写 MOAntiSpy.log
Log=1
