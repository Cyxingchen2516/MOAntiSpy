; ============================================================================
; MOAntiSpy - 己方单位/建筑优先攻击攻击范围内的敌方间谍
;
; 【使用范围】建议仅 PVE / 单人战役 / 人机对战使用。
;             禁止在 PVP（玩家对玩家）中使用：
;             它会让间谍几乎无法使用，严重破坏对抗平衡。
; ============================================================================
[AntiSpy]
Enable=1

; 扫描间隔(逻辑帧)。15 ≈ 半秒
Interval=15

; 额外的间谍类型 ID, 逗号分隔。留空使用内置列表(SPY/SPY2/SPY3/SPYF/SPYG/SPYS/SABOT)
SpyTypes=

; 1 = 纯对空武器(如爱国者)不参与, 避免它们被派去打地面间谍
SkipAA=1

; 1 = 写 MOAntiSpy.log
Log=1
